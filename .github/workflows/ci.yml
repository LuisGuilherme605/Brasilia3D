name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, formatação e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Dados estruturados em dia
        run: npm run seo:check

      - name: Testes unitários
        run: npm test

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Guarda o relatório quando algo falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
